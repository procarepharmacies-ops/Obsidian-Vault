    body {

      opacity: 0.45;

    .blob-1 {

      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(99, 102, 241, 0.4);

      box-shadow: 0 16px 40px -10px rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);

      border: 1px solid rgba(255, 255, 255, 0.08);

      width: 7px;
      height: 7px;

                        filterSource === source
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                          : 'glass-pill text-slate-400 hover:text-white'
                      }`}
                    >
                      {source.toUpperCase()}
                    </button>
                  ))}
                </div>
              </div>

              {/* Concepts Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {filteredConcepts.map(c => (
                  <div
                    key={c.id}
                    onClick={() => openNote(c.path)}
                    className="glass-card rounded-2xl p-6 cursor-pointer group flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-indigo-500/15 text-indigo-300 border border-indigo-500/20">
                          {c.category}
                        </span>
                        <span className="text-[11px] text-slate-400 font-mono">{c.date}</span>
                      </div>

                      <h3 className="text-base font-bold text-white group-hover:text-indigo-300 transition-colors mb-2">
                        {c.title}
                      </h3>

                      <p className="text-xs text-slate-300 leading-relaxed mb-4">
                        {c.description}
                      </p>
                    </div>

                    <div>
                      <div className="flex flex-wrap gap-1.5 mb-4">
                        {c.tags.map(t => (
                          <span key={t} className="text-[10px] font-medium text-slate-400 bg-white/5 border border-white/5 px-2 py-0.5 rounded-md">
                            #{t}
                          </span>
                        ))}
                      </div>

                      <div className="pt-3 border-t border-white/5 flex items-center justify-between text-xs font-medium">
                        <span className="text-indigo-400 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                          Open in Obsidian →
                        </span>
                        <span className="text-emerald-400 text-[11px]">● {c.confidence}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {filteredConcepts.length === 0 && (
                <div className="text-center py-16 glass-panel rounded-2xl">
                  <p className="text-slate-400 text-sm">No concept notes match your search criteria.</p>
                </div>
              )}
            </div>
          )}

          {/* TAB 3: COMMAND CENTER & TASKS */}
          {activeTab === 'tasks' && (
            <div className="space-y-6 animate-fadeIn">
              
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* Task Checklist Panel */}
                <div className="lg:col-span-2 glass-panel rounded-2xl p-6 border border-white/10">
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-white flex items-center gap-2">
                        <span>📋</span> Ahmed's Action Items & System Roadmap
                      </h2>
                      <p className="text-xs text-slate-400">Click any checkbox to toggle completion status</p>
                    </div>
                    <button 
                      onClick={() => openNote('AI-Brain/📋 Ahmed\'s Tasks.md')}
                      className="text-xs text-indigo-400 hover:text-indigo-300 font-semibold"
                    >
                      Open Tasks File ↗
                    </button>
                  </div>

                  <div className="space-y-3">
                    {tasks.map(t => (
                      <div 
                        key={t.id}
                        onClick={() => toggleTask(t.id)}
                        className={`p-4 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${
                          t.status === 'done'
                            ? 'bg-emerald-500/5 border-emerald-500/20 text-slate-400'
                            : 'bg-white/5 border-white/5 hover:border-indigo-500/30 text-white'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <input 
                            type="checkbox"
                            checked={t.status === 'done'}
                            onChange={() => {}}
                            className="w-4 h-4 rounded text-indigo-600 focus:ring-0 focus:ring-offset-0 bg-transparent border-slate-600 cursor-pointer"
                          />
                          <div>
                            <span className={`text-sm font-medium ${t.status === 'done' ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                              {t.title}
                            </span>
                            <div className="flex items-center gap-2 mt-0.5 text-[11px] text-slate-400">
                              <span>👤 {t.assignee}</span>
                              <span>•</span>
                              <span>📁 {t.category}</span>
                            </div>
                          </div>
                        </div>

                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${
                          t.priority === 'High' ? 'bg-rose-500/15 text-rose-300 border border-rose-500/20' :
                          t.priority === 'Medium' ? 'bg-amber-500/15 text-amber-300 border border-amber-500/20' :
                          'bg-slate-500/15 text-slate-300 border border-slate-500/20'
                        }`}>
                          {t.priority}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Automation & Health Telemetry Card */}
                <div className="glass-panel rounded-2xl p-6 border border-white/10 flex flex-col justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                      <span>⚡</span> Sync Engine Telemetry
                    </h2>
                    <p className="text-xs text-slate-400 mb-6">Continuous background automation health</p>

                    <div className="space-y-4">
                      <div className="p-3.5 rounded-xl bg-white/5 border border-white/5">
                        <div className="text-[11px] text-slate-400 uppercase font-semibold">Repetition Interval</div>
                        <div className="text-sm font-bold text-emerald-400 mt-0.5">Every 120 Minutes (2 Hours)</div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-white/5 border border-white/5">
                        <div className="text-[11px] text-slate-400 uppercase font-semibold">Task Scheduler Hook</div>
                        <div className="text-sm font-bold text-white mt-0.5 font-mono">ObsidianVaultGitSync</div>
                        <div className="text-[10px] text-emerald-400 mt-1">● State: Ready (Silent pythonw)</div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-white/5 border border-white/5">
                        <div className="text-[11px] text-slate-400 uppercase font-semibold">Google Drive Isolation</div>
                        <div className="text-sm font-bold text-cyan-300 mt-0.5">Protected (.gitignore)</div>
                        <div className="text-[10px] text-slate-400 mt-1">Tokens & caches isolated from git</div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-white/10">
                    <button 
                      onClick={() => openNote('architecture/obsidian-git-setup.md')}
                      className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition-colors shadow-lg shadow-indigo-600/30"
                    >
                      Review SOP v2.1.0 ↗
                    </button>
                  </div>
                </div>

              </div>

            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 pt-6 border-t border-white/5 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              Obsidian AI Brain • Built with React & Glassmorphism
            </div>
            <div className="flex items-center gap-4">
              <span className="text-slate-400 font-mono text-[11px]">Vault: C:\Users\Ahmed\Documents\Obsidian Vault</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
